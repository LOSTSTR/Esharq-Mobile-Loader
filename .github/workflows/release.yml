name: Build Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        required: true
        description: This release's version name
        default: "1.0.0"
      versionCode:
        required: true
        description: This release's version code
        default: "1000"

permissions:
  contents: write

env:
  # gradle/libs.versions.toml asks for toolchain 25, so that is what is installed here.
  #
  # 17 also works today: Gradle auto-detects the other JDKs that happen to be on the runner image
  # and finds a 25 among them — the sibling build.yml proves it. That is luck, not a contract. The
  # day the image drops 25 the build stops with "Cannot find a Java installation matching
  # languageVersion=25", which is exactly what it does on a machine that has only 21.
  JAVA_VERSION: 25

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Set Version
        uses: chkfung/android-version-actions@v1.1
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.event.inputs.versionCode }}
          versionName: ${{ github.event.inputs.versionName }}

      # The version is set for this build only and deliberately not committed back. A workflow
      # that pushes to the branch it was launched from puts commits nobody wrote into the history,
      # and the released APK already records its own version.

      - name: Prepare Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > signing-key.jks
          ls -l signing-key.jks

      - name: Build Universal APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          ./gradlew packageDebugUniversalApk packageReleaseUniversalApk \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/signing-key.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect APKs
        run: |
          mkdir dist
          mv app/build/outputs/apk_from_bundle/debug/app-debug-universal.apk dist/app-debug.apk
          mv app/build/outputs/apk_from_bundle/release/app-release-universal.apk dist/app-release.apk
          ls -l dist

      # The one thing that must never regress: upstream ships a copy of the mod inside this APK and
      # runs it when the download fails, which would run for anyone at all. If it ever comes back,
      # the release stops here rather than shipping a way around the gate.
      - name: Verify no bundle is shipped inside the APK
        run: |
          for apk in dist/app-debug.apk dist/app-release.apk; do
            if unzip -l "$apk" | grep -qE '\.(bundle|js)$'; then
              echo "::error::$apk ships a bundled copy of the mod"
              unzip -l "$apk" | grep -E '\.(bundle|js)$'
              exit 1
            fi
          done
          echo "No bundle inside either APK."

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Create Tag and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tagged by version name, not by version code. A bare "1000" in the tag list says nothing
          # to anyone reading it, and the two numbers move together anyway.
          tag="v${{ github.event.inputs.versionName }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists, skipping creation."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "مُحمِّل إشراق للجوال ${{ github.event.inputs.versionName }}" \
            --generate-notes \
            dist/app-debug.apk dist/app-release.apk
